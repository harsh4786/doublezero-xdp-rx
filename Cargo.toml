[package]
name = "doublezero-xdp-rx"
version = "0.1.0"
edition = "2024"
description = "Standalone AF_XDP userspace receiver and benchmark tools for DoubleZero GRE shred traffic"

[lib]
name = "agave_xdp_rx"
path = "src/lib.rs"

[profile.release]
debug = true
lto = "thin"
codegen-units = 1
opt-level = 3

[dependencies]
libc = "0.2.175"
log = "0.4.28"
clap = { version = "4", features = ["derive", "env"] }
ctrlc = "3"
socket2 = { version = "0.5", features = ["all"] }
core_affinity = "0.8.3"
env_logger = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
aya = "0.13"
caps = "0.5.5"
